name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint infrastructure/helm/ai-voice-transcriber

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: api-service
            path: services/api-service
            type: uv

          - name: auth-service
            path: services/auth-service
            type: uv

          - name: file-service
            path: services/file-service
            type: uv

          - name: speech-worker
            path: services/speech-worker
            type: uv

          - name: ai-worker
            path: services/ai-worker
            type: pip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run uv tests
        if: matrix.type == 'uv'
        working-directory: ${{ matrix.path }}
        run: |
          uv sync --dev
          uv run pytest -v

      - name: Setup Python
        if: matrix.type == 'pip'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI Worker dependencies
        if: matrix.type == 'pip'
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Worker tests
        if: matrix.type == 'pip'
        working-directory: ${{ matrix.path }}
        run: |
          pytest -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: api-service
            context: .
            dockerfile: ./services/api-service/Dockerfile

          - name: file-service
            context: .
            dockerfile: ./services/file-service/Dockerfile

          - name: speech-worker
            context: .
            dockerfile: ./services/speech-worker/Dockerfile

          - name: ai-worker
            context: ./services/ai-worker
            dockerfile: ./services/ai-worker/Dockerfile

          - name: auth-service
            context: .
            dockerfile: ./services/auth-service/Dockerfile

          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ai-voice-transcriber-${{ matrix.name }}:ci