[project]
name = "auth-service"
version = "0.1.0"
description = "Authentication service for AI Voice Transcriber Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "email-validator>=2.3.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "shared",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "mypy>=2.2.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv.sources]
shared = { path = "../../shared", editable = true }
