[project]
name = "api-service"
version = "0.1.0"
description = "API service for AI Voice Transcriber Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.42",
    "psycopg[binary]>=3.2.9",
    "alembic>=1.16.4",
    "python-dotenv>=1.1.1",
    "pydantic-settings>=2.10.1",
    "asyncpg>=0.31.0",
    "httpx>=0.28.0",
    "greenlet>=3.5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.3",
    "mypy>=1.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
