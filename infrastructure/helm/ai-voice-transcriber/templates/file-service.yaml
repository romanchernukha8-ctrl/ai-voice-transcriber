apiVersion: v1
kind: Service
metadata:
  name: file-service
  labels:
    app.kubernetes.io/name: file-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.services.fileService.port }}
      targetPort: {{ .Values.services.fileService.targetPort }}
  selector:
    app.kubernetes.io/name: file-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  labels:
    app.kubernetes.io/name: file-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: file-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: file-service
    spec:
      containers:
        - name: file-service
          image: "{{ .Values.images.fileService.repository }}:{{ .Values.images.fileService.tag }}"
          imagePullPolicy: {{ .Values.images.fileService.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.fileService.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ai-voice-transcriber.fullname" . }}-config
            - secretRef:
                name: {{ include "ai-voice-transcriber.fullname" . }}-secret
