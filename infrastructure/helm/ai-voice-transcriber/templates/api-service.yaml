apiVersion: v1
kind: Service
metadata:
  name: api-service
  labels:
    app.kubernetes.io/name: api-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.services.api.port }}
      targetPort: {{ .Values.services.api.targetPort }}
  selector:
    app.kubernetes.io/name: api-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  labels:
    app.kubernetes.io/name: api-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-service
    spec:
      containers:
        - name: api-service
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.api.targetPort }}
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.api.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.api.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 5

          envFrom:
            - configMapRef:
                name: {{ include "ai-voice-transcriber.fullname" . }}-config
            - secretRef:
                name: {{ include "ai-voice-transcriber.fullname" . }}-secret